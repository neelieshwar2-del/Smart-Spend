packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
overrides:
  '@xmldom/xmldom': '>=0.8.15'
  decode-uri-component: '>=0.4.1'
  esbuild: '>=0.24.3'
  image-size: '>=2.0.3'
  node-forge: '>=1.4.1'
  postcss: '>=8.5.23'
  tar: '>=7.5.21'
allowedDeprecatedVersions:
  '@babel/plugin-proposal-class-properties': '*'
  '@babel/plugin-proposal-nullish-coalescing-operator': '*'
  '@babel/plugin-proposal-optional-chaining': '*'
  glob: '*'
  inflight: '*'
  rimraf: '*'
  uuid: '*'
peerDependencyRules:
  allowedVersions:
    lucide-react-native>react: '19'
